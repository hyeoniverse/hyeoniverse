name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-stats.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # count_private requires a PAT (repo, read:user) saved as GH_STATS_TOKEN; falls back to public-only stats
      TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      STATS_OPTS: username=hyeoniverse&show_icons=true&hide_border=true&bg_color=00000000&include_all_commits=true&count_private=true&rank_icon=github
      LANGS_OPTS: username=hyeoniverse&layout=compact&hide_border=true&bg_color=00000000&langs_count=6

    steps:
      - uses: actions/checkout@v4

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTS }}&title_color=724cf9&text_color=24292f&icon_color=724cf9
          path: profile/stats-light.svg
          token: ${{ env.TOKEN }}

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTS }}&title_color=b196fb&text_color=c9d1d9&icon_color=b196fb
          path: profile/stats-dark.svg
          token: ${{ env.TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTS }}&title_color=724cf9&text_color=24292f
          path: profile/top-langs-light.svg
          token: ${{ env.TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTS }}&title_color=b196fb&text_color=c9d1d9
          path: profile/top-langs-dark.svg
          token: ${{ env.TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
